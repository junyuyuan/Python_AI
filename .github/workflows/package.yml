name: 打包为 EXE

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - develop
      - release/**
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          pip install -r requirements.txt

      - name: 使用 PyInstaller 打包为 EXE
        shell: pwsh
        run: |
          pyinstaller --onefile --name "HelloWorld" hello_world.py

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: HelloWorld-EXE
          path: dist\HelloWorld.exe
